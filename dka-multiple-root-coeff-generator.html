<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DKA Method Multiplicity & Polynomial Coefficient Generator</title>
  <!-- Tailwind CSS, Lucide Icons, Decimal.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1f2937; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans antialiased overflow-hidden">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex flex-wrap justify-between items-center shadow-lg shrink-0">
    <div class="flex items-center space-x-3">
      <div class="p-2 bg-indigo-600 rounded-lg shadow text-white">
        <i data-lucide="cpu" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-lg font-extrabold tracking-wide text-white flex items-center gap-2">
          <span data-i18n="appTitle">MethodDKA 多重根・係数ジェネレータ</span>
          <span class="text-xs bg-emerald-500/30 text-emerald-300 border border-emerald-500/50 px-2 py-0.5 rounded-full font-mono">v3.4 (Degree Badge Enhanced)</span>
        </h1>
        <p class="text-xs text-gray-400" data-i18n="appSubtitle">DKA法ベンチマーク用：MethodDka一括ペースト対応 任意精度多項式係数生成ツール</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-3 mt-2 sm:mt-0">
      <!-- Language Switcher -->
      <div class="flex bg-gray-900 border border-gray-700 rounded-lg p-0.5 text-xs font-bold">
        <button id="langJA" class="px-2.5 py-1 rounded-md transition text-white bg-indigo-600">JP</button>
        <button id="langEN" class="px-2.5 py-1 rounded-md transition text-gray-400 hover:text-white">EN</button>
      </div>

      <button id="btnExportJSON" class="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-medium transition shadow">
        <i data-lucide="download" class="w-4 h-4"></i> <span data-i18n="btnJSON">JSON出力</span>
      </button>
      <button id="btnExportCSV" class="flex items-center gap-1.5 px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-white rounded text-xs font-medium transition border border-gray-600">
        <i data-lucide="file-text" class="w-4 h-4"></i> <span data-i18n="btnCSV">CSV出力</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 overflow-hidden">
    
    <!-- Left Column: Complex Plane & Roots Table (5 Cols) -->
    <section class="lg:col-span-5 bg-gray-800 rounded-xl border border-gray-700 p-4 flex flex-col shadow-md overflow-hidden">
      <div class="flex justify-between items-center mb-2 shrink-0">
        <h2 class="text-xs font-bold text-gray-200 uppercase tracking-wider flex items-center gap-2">
          <i data-lucide="target" class="w-4 h-4 text-indigo-400"></i> <span data-i18n="mapTitle">複素平面上の多重根配置マップ</span>
        </h2>
        <!-- Highly Visible Degree Badge -->
        <div class="flex items-center gap-1 bg-gradient-to-r from-indigo-600 to-purple-600 border border-indigo-400/50 px-3 py-1 rounded-lg shadow-sm">
          <span class="text-[11px] text-indigo-100 font-medium" data-i18n="degreeLabel">最高次数</span>
          <span id="totalDegreeBadge" class="font-extrabold text-white text-base font-mono ml-1">N = 5</span>
        </div>
      </div>

      <!-- Canvas Box -->
      <div id="canvasContainer" class="relative flex-1 bg-gray-950 rounded-lg border border-gray-800 overflow-hidden min-h-[200px] flex items-center justify-center">
        <canvas id="complexCanvas" class="w-full h-full cursor-crosshair"></canvas>
        <div class="absolute bottom-2 left-2 bg-gray-900/80 backdrop-blur px-2 py-1 rounded text-[10px] text-gray-400 border border-gray-700 font-mono pointer-events-none" data-i18n="canvasInstruction">
          クリック: 根を追加 | ドラッグ: 移動 | ダブルクリック: 削除
        </div>
      </div>

      <!-- Root List Table -->
      <div class="mt-3 shrink-0 flex flex-col">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-semibold text-gray-300" data-i18n="tableTitle">根と重複度 (Roots & Multiplicities)</span>
          <button id="btnAddRoot" class="text-xs bg-gray-700 hover:bg-gray-600 text-indigo-300 px-2 py-1 rounded flex items-center gap-1 border border-gray-600">
            <i data-lucide="plus" class="w-3 h-3"></i> <span data-i18n="btnAddRoot">根を追加</span>
          </button>
        </div>
        
        <div class="overflow-y-auto max-h-[130px] border border-gray-700 rounded-lg bg-gray-900/50">
          <table class="w-full text-left text-xs text-gray-300">
            <thead class="bg-gray-800 text-gray-400 sticky top-0 border-b border-gray-700">
              <tr>
                <th class="p-2" data-i18n="colRe">実部 (Re)</th>
                <th class="p-2" data-i18n="colIm">虚部 (Im)</th>
                <th class="p-2" data-i18n="colM">重複度 (m)</th>
                <th class="p-2 text-right" data-i18n="colAction">操作</th>
              </tr>
            </thead>
            <tbody id="rootsTableBody" class="divide-y divide-gray-800 font-mono">
              <!-- Dynamically Populated -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Right Column: Controls, Formulas & Batch Export (7 Cols) -->
    <section class="lg:col-span-7 flex flex-col gap-3 overflow-y-auto pr-1">
      
      <!-- Presets -->
      <div class="bg-gray-800 rounded-xl border border-gray-700 p-3 shadow-md shrink-0">
        <h2 class="text-xs font-bold text-gray-200 uppercase tracking-wider mb-2 flex items-center gap-2">
          <i data-lucide="wand-2" class="w-4 h-4 text-indigo-400"></i> <span data-i18n="presetTitle">テストパターン・プリセット</span>
        </h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          <button class="preset-btn px-3 py-2 bg-gray-700 hover:bg-indigo-600/30 hover:border-indigo-500 border border-gray-600 rounded text-xs text-gray-200 text-left transition" data-preset="triple">
            <div class="font-bold" data-i18n="presetTriple">3重根 (x-1)³</div>
            <div class="text-[10px] text-gray-400" data-i18n="presetTripleSub">3重根 1つ (N=3)</div>
          </button>
          <button class="preset-btn px-3 py-2 bg-gray-700 hover:bg-indigo-600/30 hover:border-indigo-500 border border-gray-600 rounded text-xs text-gray-200 text-left transition" data-preset="cluster">
            <div class="font-bold" data-i18n="presetCluster">高次近接根群</div>
            <div class="text-[10px] text-gray-400" data-i18n="presetClusterSub">近接した根の集合</div>
          </button>
          <button class="preset-btn px-3 py-2 bg-gray-700 hover:bg-indigo-600/30 hover:border-indigo-500 border border-gray-600 rounded text-xs text-gray-200 text-left transition" data-preset="multi-complex">
            <div class="font-bold" data-i18n="presetComplex">共役複素多重根</div>
            <div class="text-[10px] text-gray-400" data-i18n="presetComplexSub">(x² + 1)² (N=4)</div>
          </button>
          <button class="preset-btn px-3 py-2 bg-gray-700 hover:bg-indigo-600/30 hover:border-indigo-500 border border-gray-600 rounded text-xs text-gray-200 text-left transition" data-preset="random">
            <div class="font-bold" data-i18n="presetRandom">ランダム多重根</div>
            <div class="text-[10px] text-gray-400" data-i18n="presetRandomSub">自動生成</div>
          </button>
        </div>
      </div>

      <!-- MethodDka Direct Paste Output Box -->
      <div class="bg-indigo-950/40 border border-indigo-500/40 rounded-xl p-3 shadow-md shrink-0">
        <div class="flex justify-between items-center mb-1.5">
          <h2 class="text-xs font-bold text-indigo-300 uppercase tracking-wider flex items-center gap-2">
            <i data-lucide="clipboard-check" class="w-4 h-4 text-indigo-400"></i> 
            <span>MethodDka 一括ペースト用係数 (<span data-i18n="degreeSubLabel">最高次数</span> <strong id="degreeInBox" class="text-amber-400 text-sm font-mono">n = 5</strong>)</span>
          </h2>
          <button id="btnCopyDkaText" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-bold transition flex items-center gap-1 shadow">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i> <span data-i18n="btnCopyMethodDka">MethodDka用コピー</span>
          </button>
        </div>
        <input type="text" id="methodDkaPasteInput" readonly class="w-full bg-gray-950 border border-indigo-900/60 rounded p-2 font-mono text-xs text-emerald-300 focus:outline-none select-all" placeholder="係数データがここに生成されます...">
      </div>

      <!-- Batch Multi-Version Settings -->
      <div class="bg-gray-800 rounded-xl border border-gray-700 p-3 shadow-md flex-1 flex flex-col min-h-0">
        <div class="flex justify-between items-center mb-2 shrink-0">
          <h2 class="text-xs font-bold text-gray-200 uppercase tracking-wider flex items-center gap-2">
            <i data-lucide="layers" class="w-4 h-4 text-indigo-400"></i> <span data-i18n="batchTitle">複数バージョン一括テストデータ生成</span>
          </h2>
          <button id="btnGenerateBatch" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-bold transition flex items-center gap-1 shadow">
            <i data-lucide="play" class="w-3.5 h-3.5"></i> <span data-i18n="btnRunBatch">一括データ生成実行</span>
          </button>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3 text-xs shrink-0">
          <div>
            <label class="block text-gray-400 mb-1" data-i18n="labelBatchCount">生成件数 (Versions)</label>
            <input type="number" id="batchCount" value="5" min="1" max="50" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white font-mono focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-gray-400 mb-1" data-i18n="labelNoise">摂動 (Perturbation)</label>
            <input type="number" id="batchNoise" value="0.01" step="0.001" min="0" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white font-mono focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-gray-400 mb-1" data-i18n="labelPrecision">計算精度 (Digits)</label>
            <select id="decimalPrecision" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white font-mono focus:border-indigo-500 outline-none">
              <option value="32">32 Digits</option>
              <option value="64" selected>64 Digits (Standard)</option>
              <option value="128">128 Digits (High)</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-400 mb-1" data-i18n="labelOutputMode">出力形式</label>
            <select id="outputModeSelect" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white font-mono focus:border-indigo-500 outline-none">
              <option value="dkaText">MethodDka Text (Comma-separated)</option>
              <option value="json">JSON Format (Full Dataset)</option>
            </select>
          </div>
        </div>

        <div class="flex-1 flex flex-col min-h-0">
          <label class="text-xs font-semibold text-gray-400 mb-1 shrink-0" data-i18n="labelOutput">生成結果プレビュー</label>
          <textarea id="batchResultOutput" readonly class="w-full flex-1 bg-gray-950 border border-gray-800 rounded-lg p-2 font-mono text-xs text-gray-300 focus:outline-none resize-none overflow-y-auto"></textarea>
        </div>
      </div>

    </section>
  </main>

  <script>
    // i18n Dictionary
    const i18n = {
      ja: {
        appTitle: "MethodDKA 多重根・係数ジェネレータ",
        appSubtitle: "DKA法ベンチマーク用：MethodDka一括ペースト対応 任意精度多項式係数生成ツール",
        btnJSON: "JSON出力",
        btnCSV: "CSV出力",
        mapTitle: "複素平面上の多重根配置マップ",
        degreeLabel: "最高次数",
        degreeSubLabel: "最高次数",
        canvasInstruction: "クリック: 根を追加 | ドラッグ: 移動 | ダブルクリック: 削除",
        tableTitle: "根と重複度 (Roots & Multiplicities)",
        btnAddRoot: "根を追加",
        colRe: "実部 (Re)",
        colIm: "虚部 (Im)",
        colM: "重複度 (m)",
        colAction: "操作",
        presetTitle: "テストパターン・プリセット",
        presetTriple: "3重根 (x-1)³",
        presetTripleSub: "3重根 1つ (N=3)",
        presetCluster: "高次近接根群",
        presetClusterSub: "近接した根の集合",
        presetComplex: "共役複素多重根",
        presetComplexSub: "(x² + 1)² (N=4)",
        presetRandom: "ランダム多重根",
        presetRandomSub: "自動生成",
        btnCopyMethodDka: "MethodDka用コピー",
        batchTitle: "複数バージョン一括テストデータ生成",
        btnRunBatch: "一括データ生成実行",
        labelBatchCount: "生成件数 (Versions)",
        labelNoise: "摂動 (Perturbation)",
        labelPrecision: "計算精度 (Digits)",
        labelOutputMode: "出力形式",
        labelOutput: "生成結果プレビュー"
      },
      en: {
        appTitle: "MethodDKA Multiplicity & Coefficient Generator",
        appSubtitle: "MethodDka Paste-Compatible Arbitrary-Precision Coefficient Generator",
        btnJSON: "Export JSON",
        btnCSV: "Export CSV",
        mapTitle: "Complex Plane Multiplicity Root Map",
        degreeLabel: "Degree",
        degreeSubLabel: "Max Degree",
        canvasInstruction: "Click: Add Root | Drag: Move | Double Click: Delete",
        tableTitle: "Roots & Multiplicities",
        btnAddRoot: "Add Root",
        colRe: "Real (Re)",
        colIm: "Imag (Im)",
        colM: "Multiplicity (m)",
        colAction: "Action",
        presetTitle: "Test Pattern Presets",
        presetTriple: "Triple Root (x-1)³",
        presetTripleSub: "Single 3-fold root (N=3)",
        presetCluster: "Clustered Roots",
        presetClusterSub: "Cluster of close roots",
        presetComplex: "Complex Conjugates",
        presetComplexSub: "(x² + 1)² (N=4)",
        presetRandom: "Random Multiplicity",
        presetRandomSub: "Auto Generated",
        btnCopyMethodDka: "Copy for MethodDka",
        batchTitle: "Batch Multi-Version Test Case Generator",
        btnRunBatch: "Generate Batch",
        labelBatchCount: "Dataset Count",
        labelNoise: "Perturbation",
        labelPrecision: "Precision (Digits)",
        labelOutputMode: "Output Format",
        labelOutput: "Output Preview"
      }
    };

    let currentLang = 'ja';
    let roots = [
      { re: "1.0", im: "0.0", m: 3 },
      { re: "-0.5", im: "0.8660254037844386", m: 2 }
    ];
    let draggedIndex = -1;

    // Language Switcher
    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(elem => {
        const key = elem.getAttribute('data-i18n');
        if (i18n[lang][key]) elem.innerHTML = i18n[lang][key];
      });

      if (lang === 'ja') {
        document.getElementById('langJA').className = "px-2.5 py-1 rounded-md transition text-white bg-indigo-600";
        document.getElementById('langEN').className = "px-2.5 py-1 rounded-md transition text-gray-400 hover:text-white";
      } else {
        document.getElementById('langEN').className = "px-2.5 py-1 rounded-md transition text-white bg-indigo-600";
        document.getElementById('langJA').className = "px-2.5 py-1 rounded-md transition text-gray-400 hover:text-white";
      }
      updateUI();
    }

    document.getElementById('langJA').addEventListener('click', () => setLanguage('ja'));
    document.getElementById('langEN').addEventListener('click', () => setLanguage('en'));

    // Canvas Setup
    const canvas = document.getElementById('complexCanvas');
    const ctx = canvas.getContext('2d');
    const scale = 60;

    function resizeCanvas() {
      const container = document.getElementById('canvasContainer');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      drawCanvas();
    }

    function toScreen(re, im) {
      return { x: canvas.width / 2 + parseFloat(re) * scale, y: canvas.height / 2 - parseFloat(im) * scale };
    }

    function toMath(x, y) {
      return { re: ((x - canvas.width / 2) / scale).toFixed(4), im: ((canvas.height / 2 - y) / scale).toFixed(4) };
    }

    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let x = cx % scale; x < canvas.width; x += scale) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = cy % scale; y < canvas.height; y += scale) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();

      roots.forEach((root, idx) => {
        const { x, y } = toScreen(root.re, root.im);
        for (let i = 1; i <= root.m; i++) {
          ctx.beginPath();
          ctx.arc(x, y, 6 + i * 5, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(99, 102, 241, ${0.9 - i * 0.15})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#818cf8';
        ctx.fill();

        ctx.fillStyle = '#e2e8f0';
        ctx.font = '10px monospace';
        ctx.fillText(`z${idx + 1} (m=${root.m})`, x + 12, y - 8);
      });
    }

    // Decimal.js Arbitrary Precision Polynomial Multiplication
    function computeCoefficientsDecimal(rootList) {
      const precision = parseInt(document.getElementById('decimalPrecision').value) || 64;
      Decimal.set({ precision: precision });

      let coeffs = [{ re: new Decimal(1), im: new Decimal(0) }];

      rootList.forEach(root => {
        const rootRe = new Decimal(root.re);
        const rootIm = new Decimal(root.im);

        for (let count = 0; count < root.m; count++) {
          const nextCoeffs = new Array(coeffs.length + 1).fill(null).map(() => ({
            re: new Decimal(0),
            im: new Decimal(0)
          }));

          for (let i = 0; i < coeffs.length; i++) {
            nextCoeffs[i].re = nextCoeffs[i].re.plus(coeffs[i].re);
            nextCoeffs[i].im = nextCoeffs[i].im.plus(coeffs[i].im);

            const negRootRe = rootRe.negated();
            const negRootIm = rootIm.negated();

            const termRe = coeffs[i].re.times(negRootRe).minus(coeffs[i].im.times(negRootIm));
            const termIm = coeffs[i].re.times(negRootIm).plus(coeffs[i].im.times(negRootRe));

            nextCoeffs[i + 1].re = nextCoeffs[i + 1].re.plus(termRe);
            nextCoeffs[i + 1].im = nextCoeffs[i + 1].im.plus(termIm);
          }
          coeffs = nextCoeffs;
        }
      });

      return coeffs;
    }

    function updateUI() {
      const totalDegree = roots.reduce((acc, r) => acc + parseInt(r.m), 0);
      document.getElementById('totalDegreeBadge').innerText = `N = ${totalDegree}`;
      document.getElementById('degreeInBox').innerText = `n = ${totalDegree}`;

      // Roots Table
      const tbody = document.getElementById('rootsTableBody');
      tbody.innerHTML = '';
      roots.forEach((root, idx) => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-gray-800/60";
        tr.innerHTML = `
          <td class="p-2"><input type="text" value="${root.re}" data-idx="${idx}" data-field="re" class="table-input bg-gray-900 border border-gray-700 rounded px-1.5 py-0.5 w-28 text-white font-mono"></td>
          <td class="p-2"><input type="text" value="${root.im}" data-idx="${idx}" data-field="im" class="table-input bg-gray-900 border border-gray-700 rounded px-1.5 py-0.5 w-28 text-white font-mono"></td>
          <td class="p-2"><input type="number" min="1" max="50" value="${root.m}" data-idx="${idx}" data-field="m" class="table-input bg-gray-900 border border-gray-700 rounded px-1.5 py-0.5 w-16 text-indigo-400 font-bold font-mono"></td>
          <td class="p-2 text-right"><button data-idx="${idx}" class="btn-del text-red-400 hover:text-red-300 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
        `;
        tbody.appendChild(tr);
      });
      lucide.createIcons();

      // Compute Current Coefficients
      const coeffs = computeCoefficientsDecimal(roots);

      // MethodDka Direct Paste Text (Comma-separated)
      const pasteText = coeffs.map(c => {
        const reStr = c.re.toString();
        const imStr = c.im.toString();
        if (c.im.isZero()) return reStr;
        return `${reStr}${c.im.isPositive() ? '+' : ''}${imStr}i`;
      }).join(', ');
      document.getElementById('methodDkaPasteInput').value = pasteText;

      drawCanvas();
      generateBatchData();
    }

    function generateBatchData() {
      const count = parseInt(document.getElementById('batchCount').value) || 1;
      const noise = parseFloat(document.getElementById('batchNoise').value) || 0;
      const outputMode = document.getElementById('outputModeSelect').value;
      const batchResults = [];

      for (let v = 1; v <= count; v++) {
        const perturbedRoots = roots.map(r => ({
          re: (v === 1) ? r.re : (parseFloat(r.re) + (Math.random() - 0.5) * noise * 2).toString(),
          im: (v === 1) ? r.im : (parseFloat(r.im) + (Math.random() - 0.5) * noise * 2).toString(),
          m: parseInt(r.m)
        }));

        const decCoeffs = computeCoefficientsDecimal(perturbedRoots);

        if (outputMode === 'dkaText') {
          const versionLine = decCoeffs.map(c => {
            const reStr = c.re.toString();
            const imStr = c.im.toString();
            if (c.im.isZero()) return reStr;
            return `${reStr}${c.im.isPositive() ? '+' : ''}${imStr}i`;
          }).join(', ');
          batchResults.push(`// Version ${v}\n${versionLine}`);
        } else {
          batchResults.push({
            version: v,
            degree: perturbedRoots.reduce((acc, r) => acc + r.m, 0),
            roots: perturbedRoots,
            coefficients: decCoeffs.map(c => ({ re: c.re.toString(), im: c.im.toString() }))
          });
        }
      }

      if (outputMode === 'dkaText') {
        document.getElementById('batchResultOutput').value = batchResults.join('\n\n');
      } else {
        document.getElementById('batchResultOutput').value = JSON.stringify(batchResults, null, 2);
      }
    }

    // Copy to Clipboard Event
    document.getElementById('btnCopyDkaText').addEventListener('click', () => {
      const pasteInput = document.getElementById('methodDkaPasteInput');
      pasteInput.select();
      navigator.clipboard.writeText(pasteInput.value);

      const btn = document.getElementById('btnCopyDkaText');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> コピー完了!`;
      lucide.createIcons();
      setTimeout(() => {
        btn.innerHTML = originalText;
        lucide.createIcons();
      }, 1500);
    });

    // Canvas Events
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      draggedIndex = roots.findIndex(r => {
        const { x, y } = toScreen(r.re, r.im);
        return Math.hypot(x - mouseX, y - mouseY) < 12;
      });

      if (draggedIndex === -1) {
        const math = toMath(mouseX, mouseY);
        roots.push({ re: math.re, im: math.im, m: 1 });
        updateUI();
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (draggedIndex !== -1) {
        const rect = canvas.getBoundingClientRect();
        const math = toMath(e.clientX - rect.left, e.clientY - rect.top);
        roots[draggedIndex].re = math.re;
        roots[draggedIndex].im = math.im;
        updateUI();
      }
    });

    window.addEventListener('mouseup', () => { draggedIndex = -1; });

    document.getElementById('rootsTableBody').addEventListener('input', (e) => {
      if (e.target.classList.contains('table-input')) {
        const idx = parseInt(e.target.dataset.idx);
        const field = e.target.dataset.field;
        roots[idx][field] = e.target.value;
        updateUI();
      }
    });

    document.getElementById('rootsTableBody').addEventListener('click', (e) => {
      const btn = e.target.closest('.btn-del');
      if (btn) {
        roots.splice(parseInt(btn.dataset.idx), 1);
        updateUI();
      }
    });

    document.getElementById('btnAddRoot').addEventListener('click', () => {
      roots.push({ re: "0.0", im: "0.0", m: 1 });
      updateUI();
    });

    // Presets
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const preset = btn.dataset.preset;
        if (preset === 'triple') {
          roots = [{ re: "1.0", im: "0.0", m: 3 }];
        } else if (preset === 'cluster') {
          roots = [
            { re: "1.0", im: "0.0", m: 2 },
            { re: "1.05", im: "0.02", m: 1 },
            { re: "0.98", im: "-0.01", m: 1 }
          ];
        } else if (preset === 'multi-complex') {
          roots = [
            { re: "0.0", im: "1.0", m: 2 },
            { re: "0.0", im: "-1.0", m: 2 }
          ];
        } else if (preset === 'random') {
          roots = [
            { re: (Math.random() * 2 - 1).toFixed(2), im: (Math.random() * 2 - 1).toFixed(2), m: Math.floor(Math.random() * 3) + 1 }
          ];
        }
        updateUI();
      });
    });

    document.getElementById('btnGenerateBatch').addEventListener('click', updateUI);
    document.getElementById('batchCount').addEventListener('input', updateUI);
    document.getElementById('batchNoise').addEventListener('input', updateUI);
    document.getElementById('decimalPrecision').addEventListener('change', updateUI);
    document.getElementById('outputModeSelect').addEventListener('change', updateUI);

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      resizeCanvas();
      updateUI();
    });
  </script>
</body>
</html>
